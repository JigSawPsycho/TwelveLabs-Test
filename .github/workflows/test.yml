name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Each run creates and destroys its own index, so concurrent runs no
# longer share fixtures. Cancelling in-progress runs is still off — a
# queued run represents real work to verify, not work to discard.
concurrency:
  group: twelvelabs-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      TWELVELABS_API_KEY: ${{ secrets.TWELVELABS_API_KEY }}
      INDEX_NAME: citest-autogenerate-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Creates a fresh index named citest-autogenerate-<sha>, uploads every
      # fixture in assets/, and writes .env (with TWELVELABS_INDEX_ID + every
      # *_VID_ID the suite needs). dotenv (jest.config.js setupFiles) reads
      # this .env at test start.
      - name: Setup index and upload fixtures
        run: node scripts/setup.js "$TWELVELABS_API_KEY" --create-new-index --index-name="$INDEX_NAME" --force

      - name: Run tests
        run: npm test

      # Always tear down — even on test failure — so we don't leak indexes.
      # Reads the index ID setup.js wrote into .env. `|| true` so a failed
      # delete doesn't mask the real test result; the index name embeds the
      # commit SHA so leaks are still attributable.
      - name: Delete index
        if: always()
        run: |
          if [ -f .env ]; then
            INDEX_ID=$(grep '^TWELVELABS_INDEX_ID=' .env | cut -d= -f2)
            if [ -n "$INDEX_ID" ]; then
              node scripts/teardown.js "$INDEX_ID" "$TWELVELABS_API_KEY" || true
            fi
          fi

      - name: Upload jest-junit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-junit-${{ github.run_id }}
          path: reports/junit.xml
          if-no-files-found: warn
